          application/json:
            schema:
              type: object
              properties:
                firstname:
                  type: string
                  description: ""
                  example: ut
                  nullable: false
                lastname:
                  type: string
                  description: ""
                  example: esse
                  nullable: false
                email:
                  type: string
                  description: "Must be a valid email address."
                  example: leann.larkin@example.net
                  nullable: false
                country:
                  type: string
                  description: "Must be in the ISO 4217 standard."
                  example: etc
                  nullable: false
                  enum:
                    - US
                    - NG
                    - AE
                    - etc
                phone:
                  type: string
                  description: ""
                  example: et
                  nullable: false
                freelance_category_id:
                  type: integer
                  description: "The <code>id</code> of an existing record in the freelance_categories table."
                  example: 20
                  nullable: false
                password:
                  type: string
                  description: "The password must be at least 8 characters, must contain at least one special character and one number"
                  example: "?$+bP<UY{5gqgv"
                  nullable: false
              required:
                - firstname
                - lastname
                - email
                - country
                - phone
                - freelance_category_id
                - password
      security: []
