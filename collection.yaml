  /api/v1/account-reports:
    post:
      summary: ""
      operationId: postApiV1AccountReports
      description: ""
      parameters: []
      responses: {}
      tags:
        - "Account Reports"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: date
                  description: "The start date of the report."
                  example: "2021-01-01"
                  nullable: false
                end_date:
                  type: required
                  description: "The end date of the report."
                  example: "2021-02-02"
                  nullable: false
                statement_types:
                  type: array
                  description: "An array of statement types to generate. Allowed types:  ACCOUNT_STATEMENT, PAYMENTS, REFUNDS, WITHDRAWALS, INVOICES."
                  example:
                    - ACCOUNT_STATEMENT
                    - PAYMENTS
                  items:
                    type: string
                isStamped:
                  type: boolean
                  description: ""
                  example: false
                  nullable: false
              required:
                - start_date
                - statement_types
    get:
      summary: ""
      operationId: getApiV1AccountReports
      description: ""
      parameters:
        - in: query
          name: "filters[reference_no]"
          description: "Filter by Withdrawal ID."
          example: 9ca3364e-a8b9-4b1b-add6-ec232fcfa7e3
          required: false
          schema:
            type: string
            description: "Filter by Withdrawal ID."
            example: 9ca3364e-a8b9-4b1b-add6-ec232fcfa7e3
            nullable: false
        - in: query
          name: "filters[created_between]"
          description: "Filter by Statements initated in the given date range."
          example: "2018-01-01,2018-12-31"
          required: false
          schema:
            type: string
            description: "Filter by Statements initated in the given date range."
            example: "2018-01-01,2018-12-31"
            nullable: false
        - in: query
          name: "filters[status]"
          description: "Filter by Refund Status."
          example: PENDING
          required: false
          schema:
            type: string
            description: "Filter by Refund Status."
            example: PENDING
            nullable: false
            enum:
              - PENDING
              - COMPLETED
              - FAILED
        - in: query
          name: "filters[report_type]"
          description: "Filter by Report Type."
          example: REFUNDS
          required: false
          schema:
            type: string
            description: "Filter by Report Type."
            example: REFUNDS
            nullable: false
            enum:
              - ACCOUNT_STATEMENT
              - PAYMENTS
              - REFUNDS
              - WITHDRAWALS
      responses: {}
      tags:
        - "Account Reports"
