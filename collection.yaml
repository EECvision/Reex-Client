                                type: string
                                example: 01KHC4WNQ6A1A7D8Q8EF9Q3W56
                              network:
                                type: string
                                example: ethereum
                              tx_hash:
                                type: string
                                example: "0x8d9098fdf3d95fe2d2f95b078aca6e8a2e9ac36fcbefb1cc56f85441c4f67db5"
                              status:
                                type: string
                                example: submitted
                              confirmations:
                                type: string
                                example: null
                              error:
                                type: string
                                example: null
                      code:
                        type: integer
                        example: 200
                  - description: Confirmed
                    type: object
                    example:
                      success: true
                      msg: "Transfer status retrieved successfully"
                      data:
                        transfer:
                          id: 01KHC4WNQ6A1A7D8Q8EF9Q3W56
                          network: ethereum
                          tx_hash: "0x8d9098fdf3d95fe2d2f95b078aca6e8a2e9ac36fcbefb1cc56f85441c4f67db5"
                          status: confirmed
                          confirmations: 2
                          error: null
                      code: 200
                    properties:
                      success:
                        type: boolean
                        example: true
                      msg:
                        type: string
                        example: "Transfer status retrieved successfully"
                      data:
                        type: object
                        properties:
                          transfer:
                            type: object
                            properties:
                              id:
                                type: string
                                example: 01KHC4WNQ6A1A7D8Q8EF9Q3W56
                              network:
                                type: string
                                example: ethereum
                              tx_hash:
                                type: string
                                example: "0x8d9098fdf3d95fe2d2f95b078aca6e8a2e9ac36fcbefb1cc56f85441c4f67db5"
                              status:
                                type: string
                                example: confirmed
                              confirmations:
                                type: integer
                                example: 2
                              error:
                                type: string
                                example: null
                      code:
                        type: integer
                        example: 200
        404:
          description: "Not Found"
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  msg: "Transfer not found."
                  data: null
                  code: 404
                properties:
                  success:
                    type: boolean
                    example: false
                  msg:
                    type: string
                    example: "Transfer not found."
                  data:
                    type: string
                    example: null
                  code:
                    type: integer
                    example: 404
      tags:
        - "Custodial Wallets"
