                      created_at:
                        type: string
                        example: "2026-02-24T08:00:00.000000Z"
                  code:
                    type: integer
                    example: 200
        422:
          description: "Validation Error"
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  msg: "The given data was invalid."
                  errors:
                    verification_token:
                      - "Invalid or expired verification token. Please verify your OTP again."
                properties:
                  success:
                    type: boolean
                    example: false
                  msg:
                    type: string
                    example: "The given data was invalid."
                  errors:
                    type: object
                    properties:
                      verification_token:
                        type: array
                        example:
                          - "Invalid or expired verification token. Please verify your OTP again."
                        items:
                          type: string
      tags:
        - Wallets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                network_id:
                  type: string
                  description: "The <code>id</code> of an existing record in the payment_networks table."
                  example: nobis
                  nullable: false
                address:
                  type: string
                  description: "Must not be greater than 255 characters."
                  example: uhglsxlvcyqakzdbnwlxgukrt
                  nullable: false
                name:
                  type: string
                  description: "Must not be greater than 50 characters."
                  example: uoxhuzqxoo
                  nullable: true
                verification_token:
                  type: string
                  description: "Must be 64 characters."
                  example: fwaegfplhbvrblxzzystfqtunytynhtictzmckdmjaamicvrnbxdsikrtyeytwva
                  nullable: false
              required:
                - network_id
                - address
                - verification_token
