      parameters:
        - in: query
          name: "filters[ref_no]"
          description: "Filter by Reference Number."
          example: 0
          required: false
          schema:
            type: integer
            description: "Filter by Reference Number."
            example: 0
            nullable: false
        - in: query
          name: "filters[refund_email]"
          description: "Filter by Refund Email."
          example: example@mail.com
          required: false
          schema:
            type: string
            description: "Filter by Refund Email."
            example: example@mail.com
            nullable: false
        - in: query
          name: "filters[created_between]"
          description: "Filter by Transactions initated in the given date range."
          example: "2018-01-01,2018-12-31"
          required: false
          schema:
            type: string
            description: "Filter by Transactions initated in the given date range."
            example: "2018-01-01,2018-12-31"
            nullable: false
        - in: query
          name: "filters[status]"
          description: "Filter by Transaction Status."
          example: Pending
          required: false
          schema:
            type: string
            description: "Filter by Transaction Status."
            example: Pending
            nullable: false
            enum:
              - Refunded
              - Pending
              - Completed
